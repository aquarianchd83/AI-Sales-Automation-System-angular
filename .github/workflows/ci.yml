name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Compiles every template with the Angular compiler, which the unit tests (JIT) do not.
      - name: Build
        run: npx ng build --configuration development

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
