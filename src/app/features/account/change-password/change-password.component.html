<div class="page">
  <app-page-header
    title="Change password"
    subtitle="Updates your own sign-in password."
  ></app-page-header>

  <mat-card style="max-width: 480px; padding: 24px">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field class="full-width">
        <mat-label>Current password</mat-label>
        <input
          matInput
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        <mat-error *ngIf="form.controls.currentPassword.hasError('required')">
          Current password is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>New password</mat-label>
        <input
          matInput
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <mat-error *ngIf="form.controls.newPassword.hasError('required')">
          New password is required.
        </mat-error>
        <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">
          Use at least 6 characters.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Confirm new password</mat-label>
        <input
          matInput
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">
          Please confirm the new password.
        </mat-error>
      </mat-form-field>

      <p class="mat-error" *ngIf="form.hasError('passwordMismatch') && form.touched">
        The new passwords do not match.
      </p>

      <div class="page-toolbar" style="margin-top: 8px">
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving…' : 'Change password' }}
        </button>
        <a mat-button routerLink="/dashboard">Cancel</a>
      </div>
    </form>
  </mat-card>
</div>
