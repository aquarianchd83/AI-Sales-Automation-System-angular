<h2 mat-dialog-title>Resolve handoff</h2>

<mat-dialog-content>
  <p class="muted">
    {{ data.handoff.customerName || data.handoff.customerPhoneNumberE164 }} —
    {{ data.handoff.triggerReason }}
  </p>
  <form [formGroup]="form" novalidate>
    <mat-form-field class="full-width">
      <mat-label>Notes (optional)</mat-label>
      <textarea matInput formControlName="notes" rows="4" maxlength="2000"></textarea>
      <mat-error *ngIf="form.controls.notes.hasError('maxlength')">Use at most 2000 characters.</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="save()">
    {{ saving ? 'Saving…' : 'Resolve' }}
  </button>
</mat-dialog-actions>
