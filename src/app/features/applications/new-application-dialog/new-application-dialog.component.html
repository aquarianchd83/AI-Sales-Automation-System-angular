<h2 mat-dialog-title>New application</h2>

<mat-dialog-content>
  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>

  <p class="muted lead" *ngIf="!loading && plans.length">Which plan should this application run on? You can change it later and keep the answers that still apply.</p>
  <p class="muted lead" *ngIf="!loading && !plans.length">No plan is available to set up yet. Please contact support.</p>

  <div class="plans" role="radiogroup" aria-label="Plans">
    <button
      *ngFor="let plan of plans"
      type="button"
      role="radio"
      class="plan-card"
      [class.selected]="selected?.planId === plan.planId"
      [attr.aria-checked]="selected?.planId === plan.planId"
      (click)="select(plan)"
    >
      <div class="plan-head">
        <strong>{{ plan.name }}</strong>
        <mat-icon *ngIf="selected?.planId === plan.planId" class="tick">check_circle</mat-icon>
      </div>
      <div class="price">{{ currencySymbol }}{{ plan.priceMonthlyCents / 100 | number: '1.0-2' }}<span> / month</span></div>
      <div class="detail">{{ plan.requiredFieldCount }} required · {{ plan.fieldCount - plan.requiredFieldCount }} optional questions</div>
      <ul class="sections">
        <li *ngFor="let section of plan.sections">{{ section }}</li>
      </ul>
    </button>
  </div>

  <mat-form-field appearance="outline" class="name" *ngIf="selected" subscriptSizing="dynamic">
    <mat-label>Application name (optional)</mat-label>
    <input matInput [formControl]="name" [placeholder]="selected.name" maxlength="150" />
    <mat-hint>Defaults to the plan name.</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="create()" [disabled]="!selected || saving || name.invalid">
    Create &amp; start setup
  </button>
</mat-dialog-actions>
