<div class="page">
  <app-page-header
    title="Tags"
    subtitle="Labels applied to customers. Renaming re-labels a tag everywhere it's used."
  >
    <button mat-flat-button color="primary" type="button" (click)="create()">
      <mat-icon>add</mat-icon>
      New tag
    </button>
  </app-page-header>

  <mat-card class="table-card">
    <div class="filters">
      <mat-form-field class="filter-search" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="searchControl" placeholder="Tag name" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>
      <span class="spacer"></span>
      <span class="muted" *ngIf="!loading">
        {{ page.totalCount }} tag{{ page.totalCount === 1 ? '' : 's' }}
      </span>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>

    <div class="table-scroll">
      <table mat-table [dataSource]="page.items">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let tag">
            <span class="tag-chip">{{ tag.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="customerCount">
          <th mat-header-cell *matHeaderCellDef>Customers</th>
          <td mat-cell *matCellDef="let tag">
            {{ tag.customerCount }}
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let tag">
            {{ tag.createdAt | date: 'mediumDate' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
          <td mat-cell *matCellDef="let tag" class="actions-cell">
            <button mat-icon-button type="button" matTooltip="Rename" (click)="edit(tag)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button type="button" matTooltip="Delete" (click)="delete(tag)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let tag; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="empty-state" *ngIf="!loading && !page.items.length">
      <mat-icon class="empty-icon">sell</mat-icon>
      <p *ngIf="searchControl.value">No tags match that search.</p>
      <p *ngIf="!searchControl.value">
        No tags yet — create one, or add tags from a customer's record.
      </p>
    </div>

    <mat-paginator
      [length]="page.totalCount"
      [pageSize]="page.pageSize"
      [pageIndex]="page.page - 1"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPage($event)"
    ></mat-paginator>
  </mat-card>
</div>
