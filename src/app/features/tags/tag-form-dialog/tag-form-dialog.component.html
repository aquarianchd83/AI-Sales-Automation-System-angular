<h2 mat-dialog-title>{{ isEdit ? 'Rename tag' : 'New tag' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" novalidate>
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <!-- No cdkFocusInitial - see the note in campaign-form-dialog.component.html. -->
      <input matInput formControlName="name" [maxlength]="maxLength" />
      <mat-hint *ngIf="isEdit">
        Renaming re-labels this tag everywhere it's already applied.
      </mat-hint>
      <mat-error *ngIf="form.controls.name.hasError('required')">
        A name is required.
      </mat-error>
      <mat-error *ngIf="form.controls.name.hasError('maxlength')">
        Use at most {{ maxLength }} characters.
      </mat-error>
      <mat-error *ngIf="form.controls.name.hasError('tagName')">
        Tag names cannot contain ',' or ';' — those separate tags in CSV import.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="save()">
    {{ saving ? 'Saving…' : isEdit ? 'Save changes' : 'Create tag' }}
  </button>
</mat-dialog-actions>
