<h2 mat-dialog-title>WhatsApp connection — {{ data.tenantName }}</h2>

<mat-dialog-content>
  <p class="muted">The tenant's Admin can edit this connection too. Saving a change clears the previous verification.</p>
  <app-whatsapp-connection-form [config]="config" [save]="save" [verify]="verify" (changed)="onChanged($event)"></app-whatsapp-connection-form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
