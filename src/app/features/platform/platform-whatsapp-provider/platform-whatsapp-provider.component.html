<div class="page provider-page">
  <app-page-header
    title="WhatsApp provider"
    subtitle="Choose which WhatsApp integration the platform offers tenants."
  ></app-page-header>

  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>

  <mat-card *ngIf="loadFailed" class="provider-card provider-card--empty">
    <mat-icon>cloud_off</mat-icon>
    <p>The WhatsApp provider setting could not be loaded.</p>
    <button mat-stroked-button type="button" (click)="load()">Try again</button>
  </mat-card>

  <mat-card *ngIf="current && !loading" class="provider-card">
    <p class="provider-card__current">
      Active provider: <strong>{{ activeName }}</strong>
    </p>

    <mat-radio-group class="provider-card__options" [(ngModel)]="selected" [disabled]="saving" aria-label="WhatsApp provider">
      <mat-radio-button *ngFor="let p of current.providers" [value]="p.id" [disabled]="!p.available" class="provider-card__option">
        {{ p.name }}
        <span class="muted provider-card__reason" *ngIf="!p.available">{{ p.unavailableReason }}</span>
      </mat-radio-button>
    </mat-radio-group>

    <p class="muted">
      Changing the provider is recorded in the audit log. Existing messages, conversations and wallet balances are not touched.
    </p>

    <div class="provider-card__actions">
      <button mat-button type="button" [disabled]="saving || pristine" (click)="discard()">Discard</button>
      <button mat-flat-button color="primary" type="button" [disabled]="saving || pristine" (click)="save()">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </mat-card>
</div>
