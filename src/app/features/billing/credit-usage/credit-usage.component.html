<div class="page">
  <app-page-header title="Credit history" subtitle="Credits added to your wallet and credits spent, by day and by feature.">
    <a mat-stroked-button routerLink="/billing/wallet">
      <mat-icon>data_usage</mat-icon>
      Usage & credits
    </a>
  </app-page-header>

  <mat-card class="section-card history-card">
    <app-credit-history [fetchLedger]="fetchLedger" [fetchSummary]="fetchSummary" heading=""></app-credit-history>
  </mat-card>
</div>
