<div class="page">
  <app-page-header
    title="Media Library"
    subtitle="Upload images and videos, copy their public links, and use them on message templates."
  >
    <button mat-flat-button color="primary" type="button" (click)="upload()">
      <mat-icon>upload_file</mat-icon>
      Upload
    </button>
  </app-page-header>

  <mat-card class="table-card">
    <div class="filters">
      <mat-form-field class="filter-search" subscriptSizing="dynamic">
        <mat-label>Search</mat-label>
        <input matInput [formControl]="searchControl" placeholder="File name" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>
      <span class="spacer"></span>
      <span class="muted" *ngIf="!loading">
        {{ page.totalCount }} file{{ page.totalCount === 1 ? '' : 's' }}
      </span>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>

    <div class="media-grid" *ngIf="page.items.length">
      <mat-card class="media-card" *ngFor="let asset of page.items" tabindex="0" (click)="view(asset)" (keydown.enter)="view(asset)">
        <div class="thumb">
          <img *ngIf="isImage(asset.contentType)" [src]="asset.url" [alt]="asset.fileName" loading="lazy" />
          <mat-icon *ngIf="!isImage(asset.contentType)" class="thumb-icon">movie</mat-icon>
          <span class="kind-badge">{{ kindLabel(asset.contentType) }}</span>
          <div class="thumb-actions" (click)="$event.stopPropagation()">
            <button mat-mini-fab type="button" matTooltip="Copy public URL" aria-label="Copy public URL" (click)="copyUrl(asset)">
              <mat-icon>link</mat-icon>
            </button>
            <button mat-mini-fab type="button" matTooltip="Details" aria-label="Details" (click)="view(asset)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-mini-fab color="warn" type="button" matTooltip="Delete" aria-label="Delete" (click)="delete(asset)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
        <div class="media-info">
          <div class="media-name" [matTooltip]="asset.fileName">{{ asset.fileName }}</div>
          <div class="muted media-meta">{{ formatSize(asset.sizeBytes) }} · {{ asset.createdAt | date: 'mediumDate' }}</div>
        </div>
      </mat-card>
    </div>

    <div class="empty-state" *ngIf="!loading && !page.items.length">
      <mat-icon class="empty-icon">perm_media</mat-icon>
      <p *ngIf="searchControl.value">No files match that search.</p>
      <p *ngIf="!searchControl.value">No media uploaded yet.</p>
    </div>

    <mat-paginator
      [length]="page.totalCount"
      [pageSize]="page.pageSize"
      [pageIndex]="page.page - 1"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPage($event)"
    ></mat-paginator>
  </mat-card>
</div>
