<div class="login-page">
  <mat-card class="login-card">
    <div class="login-brand">
      <mat-icon color="primary">forum</mat-icon>
      <div>
        <h1>Sales Automation</h1>
        <p class="muted">WhatsApp marketing &amp; AI sales admin panel</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="admin@example.com"
        />
        <mat-icon matSuffix>mail_outline</mat-icon>
        <mat-error *ngIf="form.controls.email.hasError('required')">
          Email is required.
        </mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">
          Enter a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.controls.password.hasError('required')">
          Password is required.
        </mat-error>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        class="full-width submit"
        type="submit"
        [disabled]="submitting"
      >
        <mat-spinner *ngIf="submitting" diameter="18"></mat-spinner>
        <span>{{ submitting ? 'Signing in…' : 'Sign in' }}</span>
      </button>
    </form>

    <p class="hint muted">
      Forgot your password? Ask a Super Admin to reset it — self-service reset is not
      part of the Phase 2 API.
    </p>
  </mat-card>
</div>
