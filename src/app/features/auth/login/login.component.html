<div class="login-page">
  <mat-card class="login-card">
    <img class="app-logo" src="assets/brand/aisaarthi-logo.png" alt="AiSaarthi" width="1048" height="251" />
    <p class="muted app-logo-tagline">AI sales automation for WhatsApp</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="admin@example.com"
        />
        <mat-icon matSuffix>mail_outline</mat-icon>
        <mat-error *ngIf="form.controls.email.hasError('required')">
          Email is required.
        </mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">
          Enter a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.controls.password.hasError('required')">
          Password is required.
        </mat-error>
      </mat-form-field>

      <mat-checkbox class="remember-me" color="primary" formControlName="rememberMe">
        Remember me
      </mat-checkbox>

      <button
        mat-flat-button
        color="primary"
        class="full-width submit"
        type="submit"
        [disabled]="submitting"
      >
        <mat-spinner *ngIf="submitting" diameter="18"></mat-spinner>
        <span>{{ submitting ? 'Signing in…' : 'Sign in' }}</span>
      </button>
    </form>

    <p class="hint muted">
      New here? <a routerLink="signup">Create a workspace</a> — start free, no card required.
    </p>
    <p class="hint muted">
      <a routerLink="/recover/forgot-password">Forgot your password?</a>
    </p>
    <p class="hint muted legal-links">
      <a routerLink="/terms">Terms and Conditions</a> · <a routerLink="/privacy">Privacy Policy</a>
    </p>
  </mat-card>
</div>
